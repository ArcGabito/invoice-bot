name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: uv.lock al día con pyproject.toml
        run: uv lock --check
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy

  # Pruebas completas contra un SQL Server real (contenedor de servicio).
  test:
    runs-on: ubuntu-latest
    env:
      SA_PASSWORD: Ci-InvoiceBot-2026!sa
      INVOICEBOT_TEST_DB_SERVER: localhost
      INVOICEBOT_TEST_DB_PORT: '1433'
      INVOICEBOT_TEST_DB_USER: sa
      INVOICEBOT_TEST_DB_PASSWORD: Ci-InvoiceBot-2026!sa
      INVOICEBOT_TEST_DB_TRUST_CERT: 'true'
      # Falla en vez de omitir las pruebas de integración si falta la conexión.
      INVOICEBOT_TEST_DB_REQUIRED: 'true'
      INVOICEBOT_TEST_REDIS_URL: redis://localhost:6379/15
      INVOICEBOT_TEST_REDIS_REQUIRED: 'true'
    services:
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: Ci-InvoiceBot-2026!sa
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Controlador ODBC 18 y Tesseract
        run: |
          if ! dpkg -s msodbcsql18 >/dev/null 2>&1; then
            curl -fsSL https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb -o /tmp/mprod.deb
            sudo dpkg -i /tmp/mprod.deb
            sudo apt-get update
            sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
          fi
          sudo apt-get install -y unixodbc tesseract-ocr tesseract-ocr-spa
      - run: uv sync --locked
      - run: uv run pytest --cov --cov-report=term-missing:skip-covered

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest tests/unit

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Construir la imagen
        run: docker build -t invoicebot:ci .
      - name: La imagen arranca y tiene ODBC y Tesseract
        run: |
          docker run --rm invoicebot:ci --version
          docker run --rm --entrypoint sh invoicebot:ci -c "odbcinst -q -d | grep -q 'ODBC Driver 18' && tesseract --list-langs | grep -q spa"
      - name: docker-compose.yml es válido
        run: touch .env && REDIS_PASSWORD=x MSSQL_SA_PASSWORD=x INVOICEBOT_DOMAIN=example.com docker compose --profile sql --profile proxy --profile tools config --quiet
      - name: La plantilla de Azure (Bicep) compila
        run: az bicep build --file deploy/azure/main.bicep --stdout > /dev/null
      # Vulnerabilidades con parche disponible en la imagen (informativo: no bloquea todavía;
      # pásalo a exit-code 1 cuando la línea base esté limpia).
      - name: Escaneo de vulnerabilidades (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: invoicebot:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: invoicebot:ci
          format: spdx-json
          artifact-name: invoicebot-sbom.spdx.json

  # Imagen publicada en GHCR para Azure Container Apps y para los VPS (solo en main).
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/arcgabito/invoice-bot:latest
            ghcr.io/arcgabito/invoice-bot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
