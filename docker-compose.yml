# InvoiceBot en un VPS (o un servidor de la oficina) con Docker Compose.
# Guía completa: docs/despliegue-vps.md
#
#   cp .env.example .env                  # base de datos, IA, correo, dominio, Redis…
#   docker compose --profile sql up -d sqlserver        # opcional: SQL Server en el mismo VPS
#   docker compose run --rm migrate                     # crea la base y aplica migraciones
#   docker compose run --rm api user add admin --name "Administrador"
#   docker compose --profile sql --profile proxy up -d  # todo, con HTTPS
#   docker compose up -d --scale worker=3               # más workers en horas pico
#
# Procesos (misma imagen):
#   api         API REST y pantalla de revisión
#   worker      colas ingest, sunat y default (correo, escaneo, SUNAT, exportaciones)
#   extractor   cola extract (OCR e IA): más CPU y memoria, escala aparte
#   scheduler   tareas programadas (INVOICEBOT_SCHEDULE_*)
#   redis       colas, límites de llamadas y caché (con persistencia AOF)
#
# Sin --profile sql, el bot usa el SQL Server de INVOICEBOT_DB_* (otro servidor o Azure SQL).
# Sin --profile proxy, publica la API en 127.0.0.1:8000 para tu propio Nginx/Caddy.

x-invoicebot: &invoicebot
  build: .
  image: ${INVOICEBOT_IMAGE:-ghcr.io/arcgabito/invoice-bot:latest}
  env_file: .env
  restart: unless-stopped
  volumes:
    - invoicebot-data:/data
    - ${INVOICEBOT_INBOX_HOST_DIR:-./inbox}:/data/inbox
    - ${INVOICEBOT_EXPORT_HOST_DIR:-./exports}:/data/exports
    # Misma ruta que en el contenedor de SQL Server: el bot ve las copias y borra las antiguas.
    - sqlserver-backups:/var/opt/mssql/backup
  depends_on:
    redis:
      condition: service_healthy

x-invoicebot-env: &invoicebot-env
  INVOICEBOT_DB_SERVER: ${INVOICEBOT_DB_SERVER:-sqlserver}
  INVOICEBOT_BACKUP_DIR: /var/opt/mssql/backup
  INVOICEBOT_DATA_DIR: /data/app
  INVOICEBOT_INBOX_DIR: /data/inbox
  INVOICEBOT_EXPORT_DIR: /data/exports
  INVOICEBOT_QUEUE_BACKEND: redis
  INVOICEBOT_REDIS_URL: redis://:${REDIS_PASSWORD:?Define REDIS_PASSWORD en .env}@redis:6379/0
  # Varias réplicas: migra solo el servicio `migrate`.
  INVOICEBOT_AUTO_MIGRATE: 'false'

x-worker: &worker
  <<: *invoicebot
  stop_grace_period: 2m
  healthcheck:
    disable: true

services:
  # Aplica las migraciones y termina (`docker compose run --rm migrate`).
  migrate:
    <<: *invoicebot
    command: ['db', 'migrate']
    restart: 'no'
    profiles: ['tools']
    healthcheck:
      disable: true
    environment:
      <<: *invoicebot-env
      INVOICEBOT_AUTO_MIGRATE: 'true'

  api:
    <<: *invoicebot
    command: ['serve', '--workers', '${INVOICEBOT_API_WORKERS:-2}']
    environment:
      <<: *invoicebot-env
    ports:
      - '${INVOICEBOT_API_PUBLISH:-127.0.0.1:8000}:8000'

  worker:
    <<: *worker
    command: ['worker', '--queues', 'ingest,sunat,default']
    environment:
      <<: *invoicebot-env
    deploy:
      resources:
        limits:
          cpus: '${INVOICEBOT_WORKER_CPUS:-1}'
          memory: ${INVOICEBOT_WORKER_MEMORY:-1g}

  extractor:
    <<: *worker
    command: ['worker', '--queues', 'extract']
    environment:
      <<: *invoicebot-env
    deploy:
      resources:
        limits:
          cpus: '${INVOICEBOT_EXTRACTOR_CPUS:-2}'
          memory: ${INVOICEBOT_EXTRACTOR_MEMORY:-2g}

  scheduler:
    <<: *worker
    command: ['scheduler']
    environment:
      <<: *invoicebot-env

  # Colas: persistencia AOF y sin desalojo de claves (perder una clave = perder un trabajo).
  redis:
    image: redis:${REDIS_VERSION:-8}
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?Define REDIS_PASSWORD en .env}
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Define REDIS_PASSWORD en .env}

  # SQL Server en el mismo VPS (Express: gratis hasta 10 GB). Perfil `sql`.
  sqlserver:
    profiles: ['sql']
    image: mcr.microsoft.com/mssql/server:${MSSQL_VERSION:-2022-latest}
    restart: unless-stopped
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: ${MSSQL_PID:-Express}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD en .env}
      TZ: ${TZ:-America/Lima}
    ports:
      - '127.0.0.1:${MSSQL_HOST_PORT:-1433}:1433'
    volumes:
      - sqlserver-data:/var/opt/mssql
      - sqlserver-backups:/var/opt/mssql/backup
    healthcheck:
      test: ['CMD-SHELL', '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # HTTPS automático con Let's Encrypt delante de la API. Perfil `proxy`.
  caddy:
    profiles: ['proxy']
    image: caddy:2
    restart: unless-stopped
    environment:
      INVOICEBOT_DOMAIN: ${INVOICEBOT_DOMAIN:?Define INVOICEBOT_DOMAIN en .env}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/vps/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - api

volumes:
  invoicebot-data:
  redis-data:
  sqlserver-data:
  sqlserver-backups:
  caddy-data:
