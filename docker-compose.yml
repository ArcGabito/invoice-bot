# InvoiceBot con SQL Server en Docker (servidor Linux, o desarrollo en un PC).
# Guía completa: docs/instalacion-linux.md
#
#   cp .env.example .env        # completa MSSQL_SA_PASSWORD, INVOICEBOT_DB_* y la IA
#   docker compose build
#   docker compose up -d sqlserver
#   docker compose run --rm bot db init   # con las variables de administrador (ver la guía)
#   docker compose up -d
#
# Las variables de .env llegan a los contenedores; las de `environment` de
# cada servicio tienen prioridad (rutas dentro del contenedor).

x-invoicebot: &invoicebot
  build: .
  image: invoicebot:${INVOICEBOT_IMAGE_TAG:-latest}
  env_file: .env
  restart: unless-stopped
  depends_on:
    sqlserver:
      condition: service_healthy
    init-volumes:
      condition: service_completed_successfully
  volumes:
    - invoicebot-data:/app/data
    - ${INVOICEBOT_INBOX_HOST_DIR:-./facturas}:/inbox:ro
    - ${INVOICEBOT_EXPORT_HOST_DIR:-./exports}:/app/exports
    - ${INVOICEBOT_LOG_HOST_DIR:-./logs}:/app/logs
    - ${INVOICEBOT_TLS_HOST_DIR:-./tls}:/app/tls:ro
    # Misma ruta que en el contenedor de SQL Server: así el bot ve las copias
    # que escribe el servidor y puede borrar las antiguas.
    - sqlserver-backups:/var/opt/mssql/backup

x-invoicebot-env: &invoicebot-env
  INVOICEBOT_DB_SERVER: sqlserver
  INVOICEBOT_DB_PORT: '1433'
  # Certificado autofirmado del contenedor de SQL Server, en la red interna de Docker.
  INVOICEBOT_DB_TRUST_CERT: 'true'
  INVOICEBOT_INBOX_DIR: /inbox
  INVOICEBOT_DATA_DIR: /app/data
  INVOICEBOT_EXPORT_DIR: /app/exports
  INVOICEBOT_LOG_DIR: /app/logs
  INVOICEBOT_BACKUP_DIR: /var/opt/mssql/backup
  # La contraseña de sa está en .env para el contenedor de SQL Server; el bot no la necesita.
  MSSQL_SA_PASSWORD: ''

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:${MSSQL_VERSION:-2022-latest}
    restart: unless-stopped
    environment:
      ACCEPT_EULA: 'Y'
      # Express es gratuita para producción (bases de hasta 10 GB). Developer
      # solo para desarrollo y pruebas; Standard o Enterprise con licencia.
      MSSQL_PID: ${MSSQL_PID:-Express}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD en .env}
      TZ: ${TZ:-America/Lima}
    # Solo accesible desde este equipo (herramientas de administración y `npm test`).
    ports:
      - '127.0.0.1:${MSSQL_HOST_PORT:-1433}:1433'
    volumes:
      - sqlserver-data:/var/opt/mssql
      - sqlserver-backups:/var/opt/mssql/backup
    depends_on:
      init-volumes:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q 'SELECT 1' -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Deja la carpeta de copias escribible por SQL Server y por el bot (UID 10001
  # en las dos imágenes). Termina al instante.
  init-volumes:
    image: busybox:1.37
    command: ['sh', '-c', 'chown 10001:0 /backup && chmod 2770 /backup']
    volumes:
      - sqlserver-backups:/backup
    restart: 'no'

  # Ciclo desatendido: reintenta, escanea /inbox, verifica, exporta y respalda.
  bot:
    <<: *invoicebot
    command: ['run', '--watch']
    environment:
      <<: *invoicebot-env

  # Pantalla de revisión. Escucha en todas las interfaces del contenedor, así
  # que exige usuarios (`invoicebot user add`) y HTTPS (certificado en ./tls).
  review:
    <<: *invoicebot
    command: ['serve']
    environment:
      <<: *invoicebot-env
      INVOICEBOT_SERVE_HOST: 0.0.0.0
      INVOICEBOT_SERVE_PORT: '4317'
    ports:
      - '${INVOICEBOT_SERVE_PUBLISH:-4317}:4317'

volumes:
  sqlserver-data:
  sqlserver-backups:
  invoicebot-data:
