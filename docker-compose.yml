# InvoiceBot en un VPS (o un servidor de la oficina) con Docker Compose.
# Guía completa: docs/despliegue-vps.md
#
#   cp .env.example .env                  # base de datos, IA, correo, dominio…
#   docker compose --profile sql up -d sqlserver        # opcional: SQL Server en el mismo VPS
#   docker compose run --rm api db init                 # crea la base y aplica migraciones
#   docker compose run --rm api user add admin --name "Administrador"
#   docker compose --profile sql --profile proxy up -d  # API + bot + SQL Server + HTTPS
#
# Sin --profile sql, el bot usa el SQL Server de INVOICEBOT_DB_* (otro servidor o Azure SQL).
# Sin --profile proxy, publica la API en 127.0.0.1:8000 para tu propio Nginx/Caddy.

x-invoicebot: &invoicebot
  build: .
  image: ${INVOICEBOT_IMAGE:-ghcr.io/arcgabito/invoice-bot:latest}
  env_file: .env
  restart: unless-stopped
  volumes:
    - invoicebot-data:/data
    - ${INVOICEBOT_INBOX_HOST_DIR:-./inbox}:/data/inbox
    - ${INVOICEBOT_EXPORT_HOST_DIR:-./exports}:/data/exports
    # Misma ruta que en el contenedor de SQL Server: el bot ve las copias y borra las antiguas.
    - sqlserver-backups:/var/opt/mssql/backup

x-invoicebot-env: &invoicebot-env
  INVOICEBOT_DB_SERVER: ${INVOICEBOT_DB_SERVER:-sqlserver}
  INVOICEBOT_BACKUP_DIR: /var/opt/mssql/backup
  INVOICEBOT_DATA_DIR: /data/app
  INVOICEBOT_INBOX_DIR: /data/inbox
  INVOICEBOT_EXPORT_DIR: /data/exports

services:
  # API REST y pantalla de revisión (uvicorn).
  api:
    <<: *invoicebot
    command: ['serve', '--workers', '${INVOICEBOT_API_WORKERS:-2}']
    environment:
      <<: *invoicebot-env
    ports:
      - '${INVOICEBOT_API_PUBLISH:-127.0.0.1:8000}:8000'

  # Ciclo RPA desatendido: correo, reintentos, escaneo, SUNAT, exportación y copia.
  worker:
    <<: *invoicebot
    command: ['run', '--watch']
    healthcheck:
      disable: true
    environment:
      <<: *invoicebot-env

  # SQL Server en el mismo VPS (Express: gratis hasta 10 GB). Perfil `sql`.
  sqlserver:
    profiles: ['sql']
    image: mcr.microsoft.com/mssql/server:${MSSQL_VERSION:-2022-latest}
    restart: unless-stopped
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: ${MSSQL_PID:-Express}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD en .env}
      TZ: ${TZ:-America/Lima}
    ports:
      - '127.0.0.1:${MSSQL_HOST_PORT:-1433}:1433'
    volumes:
      - sqlserver-data:/var/opt/mssql
      - sqlserver-backups:/var/opt/mssql/backup
    healthcheck:
      test: ['CMD-SHELL', '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # HTTPS automático con Let's Encrypt delante de la API. Perfil `proxy`.
  caddy:
    profiles: ['proxy']
    image: caddy:2
    restart: unless-stopped
    environment:
      INVOICEBOT_DOMAIN: ${INVOICEBOT_DOMAIN:?Define INVOICEBOT_DOMAIN en .env}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/vps/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - api

volumes:
  invoicebot-data:
  sqlserver-data:
  sqlserver-backups:
  caddy-data:
